[package]
name = "code_report_tracker"
version = "0.1.0"
description = "Code Report Tracker desktop application"
authors = ["Code Report Tracker"]
edition = "2021"

[lib]
name = "code_report_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
